[metadata]
name = karnataka-politicians-tracker
version = 1.0.0
author = Team Karnataka
author_email = team@karnatakapoliticians.example.com
description = Open source public tracker for Karnataka politicians with bilingual support
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/karnataka-politicians-tracker
license = MIT
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 4.2
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Internet :: WWW/HTTP
    Topic :: Software Development :: Libraries :: Application Frameworks

[options]
packages = find:
python_requires = >=3.10
include_package_data = true
install_requires =
    Django>=4.2.0
    djangorestframework>=3.14.0
    django-filter>=23.0
    mysqlclient>=2.2.0
    redis>=5.0.0
    python-dotenv>=1.0.0

[options.packages.find]
where = .
exclude =
    tests*
    migrations*
    docs*

[options.entry_points]
console_scripts =
    politicians-tracker = manage:main

[options.extras_require]
dev =
    coverage>=7.0.0
    factory-boy>=3.2.0
    flake8>=6.0.0
    black>=23.0.0
    isort>=5.12.0
test =
    coverage>=7.0.0
    factory-boy>=3.2.0
docs =
    drf-yasg>=1.21.0
