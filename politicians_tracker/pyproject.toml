[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "karnataka-politicians-tracker"
version = "1.0.0"
description = "Open source public tracker for Karnataka politicians with bilingual support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Team Karnataka", email = "team@karnataka Politicians tracker.example.com"}
]

dependencies = [
    "Django>=4.2.0",
    "djangorestframework>=3.14.0",
    "django-filter>=23.0",
    "mysqlclient>=2.2.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "factory-boy>=3.2.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
test = [
    "coverage>=7.0.0",
    "factory-boy>=3.2.0",
]
docs = [
    "drf-yasg>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/karnataka-politicians-tracker"
Issues = "https://github.com/yourusername/karnataka-politicians-tracker/issues"
Documentation = "https://github.com/yourusername/karnataka-politicians-tracker#readme"

[tool.setuptools]
packages = ["politicians_tracker", "politicians_tracker.apps.core"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | migrations
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.pytest.ini_options]
testpaths = ["politicians_tracker/apps/core/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["politicians_tracker/apps/core"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
