# =============================================================================
# Nginx Reverse Proxy for Karnataka Politicians Tracker
# Production-grade: rate limiting, gzip, SSL-ready, security headers
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_analytics:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream django_backend {
    server django:8000;
    keepalive 100;  # Persistent connections to Gunicorn
}

server {
    listen 80;
    server_name _;

    # --- Security ---
    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 4k;

    # Connection limiting: 50 concurrent per IP
    limit_conn conn_limit 50;

    # --- GZip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml;

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- API Proxy ---
    location /api/ {
        limit_req zone=api_general burst=200 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        # Response caching at Nginx level (10 min)
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;

        # Keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Analytics endpoint (stricter rate limit)
    location /api/v1/analytics/ {
        limit_req zone=api_analytics burst=5 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check (no rate limiting)
    location /api/v1/health/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Block admin access from outside (only allow internal/VPN)
    location ~* /mgmt- {
        # In production, restrict to VPN IP range:
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Static files (if serving via Nginx)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block common attack paths
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
    location /wp-admin { return 404; }
    location /wp-login { return 404; }
    location /xmlrpc.php { return 404; }
}
