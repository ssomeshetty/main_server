# =============================================================================
# Nginx Reverse Proxy for Karnataka Politicians Tracker
# Production-grade: rate limiting, gzip, SSL-ready, security headers
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_analytics:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream django_backend {
    server django:8000;
    keepalive 100;  # Persistent connections to Gunicorn
}

# Port 80 is intentionally only an HTTPS redirect.  Put the certificate files
# named in docker-compose.prod.yml in politicians_tracker/ssl before starting.
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # --- Security ---
    server_tokens off;
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 4k;

    # Connection limiting: 50 concurrent per IP
    limit_conn conn_limit 50;

    # --- GZip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml;

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- API Proxy ---
    location /api/ {
        limit_req zone=api_general burst=200 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;

        # Keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Analytics endpoint (stricter rate limit)
    location /api/v1/analytics/ {
        limit_req zone=api_analytics burst=5 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check (no rate limiting)
    location /api/v1/health/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Admin is not exposed through the public proxy. Use a VPN/bastion or a
    # separate internal ingress for Django administration.
    location ~* ^/mgmt- {
        return 404;
    }

    # Next.js application, including its own static assets and image handler.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # Kept for a private, separately configured admin ingress only.
    location = /__internal_admin_disabled__ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Django static files (if serving via Nginx)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block common attack paths
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }
    location /wp-admin { return 404; }
    location /wp-login { return 404; }
    location /xmlrpc.php { return 404; }
}
